allowlist:
  hosts: ["localhost:8080", "127.0.0.1:8080"]
  routes: ["/", "/console", "/console/*"]
  actions: [navigate, click, type, select, key, wait_for, read, assert, dismiss, finish]
mutating_routes:
  - "POST *"
  - "GET /console/member/flag"
  - "GET /console/subaccount/confirm*"
  - "GET /console/*/delete*"
# Reviewed exceptions to mutating_routes, for this application only. Legacy
# WebForms-style consoles POST for everything - sign-on, search, even switching
# tabs - so "POST *" alone makes every read-only flow require approval. Each line
# is a human-reviewed statement that the route reads or establishes a session and
# changes no record. Control names are still checked against irreversible_verbs,
# so a "Delete" postback to an exempt route is still irreversible. Residual risk:
# a mutating postback whose control name carries no listed verb.
readonly_routes:
  - "POST /"                  # sign-on: establishes a session
  - "POST /console/search"    # member search
  - "POST /console/member"    # member-detail tab postbacks (__doPostBack)
irreversible_verbs: [transfer, submit, confirm, delete, remove, close, wire, disburse,
                     post, approve, send, pay, withdraw, freeze]
unknown_state_policy: safe_only
limits:
  max_actions_per_minute: 60
  max_steps_per_run: 25
  loop_breaker: 3
