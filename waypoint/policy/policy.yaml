allowlist:
  hosts: ["localhost:8080", "127.0.0.1:8080"]
  routes: ["/", "/console", "/console/*"]
  actions: [navigate, click, type, select, key, wait_for, read, assert, dismiss, finish]
mutating_routes:
  - "POST *"
  - "GET /console/member/flag"
  - "GET /console/subaccount/confirm*"
  - "GET /console/*/delete*"
irreversible_verbs: [transfer, submit, confirm, delete, remove, close, wire, disburse,
                     post, approve, send, pay, withdraw, freeze]
unknown_state_policy: safe_only
limits:
  max_actions_per_minute: 60
  max_steps_per_run: 25
  loop_breaker: 3
