<html>
<head><title>Meridian Servicing Console - Sign On</title></head>
<body bgcolor="#EFEFE7" style="font-family: Verdana, Arial, sans-serif; font-size: 11px;">
<table width="100%" cellpadding="0" cellspacing="0" border="0">
  <tr><td bgcolor="#1F3A63" height="46">
    <font color="#FFFFFF" size="4">&nbsp;Meridian&nbsp;Servicing&nbsp;Console</font>
  </td></tr>
</table>
<br><br>
<center>
<table cellpadding="6" cellspacing="0" border="1" bordercolor="#B0B0A0" bgcolor="#F7F7F2">
  <form method="post" action="/">
  <tr><td colspan="2" bgcolor="#DDDDD0"><b>Operator Sign On</b></td></tr>
  <!-- Labels are adjacent cells, not <label for>. Deliberate. -->
  <tr><td>User ID</td>
      <td><input type="text" name="txtUserId" id="ctl00_txtUserId" size="20"></td></tr>
  <tr><td>Password</td>
      <td><input type="password" name="txtPassword" id="ctl00_txtPassword" size="20"></td></tr>
  <tr><td colspan="2" align="right">
      <input type="submit" id="ctl00_btnSignOn" value="Sign On"></td></tr>
  {% if error %}
  <tr><td colspan="2"><font color="#AA0000">{{ error }}</font></td></tr>
  {% endif %}
  </form>
</table>
</center>
</body>
</html>
